name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a version release with this tag (e.g. v0.5.0); leave empty for a normal build"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets cannot be used in a step condition directly.
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # A version release comes from a pushed v* tag, or from a manual run with a release tag.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history with tags: the dev build's version name is the last v* tag plus "-dev" (#88).
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      # Own signing key (A-8) for dev builds and versions, from GitHub Secrets; without it the debug key is used.
      - name: Signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Only a key with alias gym8020 that opens with the password is used; otherwise the debug key, loudly.
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias gym8020 >/dev/null 2>&1; then
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with your own key (alias gym8020)."
          else
            rm -f "$RUNNER_TEMP/release.jks"
            echo "::warning::Signing secrets do not open a key with alias gym8020; this build uses the debug key."
          fi

      - name: Build debug APK
        if: hashFiles('app/build.gradle.kts') != ''
        # Unit, UI and screenshot tests (TESTING.md T-4/T-5). Screenshots are recorded, not yet compared:
        # once the references are approved they go into the repo and CI switches to verifying.
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -Proborazzi.test.record=true --console=plain

      - name: Upload screenshots
        if: always() && hashFiles('app/build.gradle.kts') != ''
        # Also on the branch ci-screenshots; a full artifact store must not stop the dev release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 3

      # The same screenshots on the branch ci-screenshots (overwritten each build), so they can be viewed
      # without downloading artifacts.
      - name: Publish screenshots to branch
        if: always() && github.event_name == 'push' && hashFiles('app/build/outputs/roborazzi/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cp app/build/outputs/roborazzi/*.png /tmp/shots/
          cd /tmp/shots
          git init -q && git checkout -q -b ci-screenshots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      # New Room schema versions are generated here; commit them to app/schemas for migration tests.
      - name: Check Room schemas
        if: hashFiles('app/build.gradle.kts') != ''
        run: git status --porcelain app/schemas; for f in $(git ls-files --others --exclude-standard app/schemas); do echo "=== NEW $f"; python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))" "$f"; done

      - name: Upload APK
        if: hashFiles('app/build.gradle.kts') != ''
        # Also in the dev release; a full artifact store must not stop it.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gym-8020-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      # Rolling "dev" release: always the newest build at a fixed link,
      # https://github.com/<owner>/<repo>/releases/download/dev/gym-8020.apk
      - name: Publish dev release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && hashFiles('app/build.gradle.kts') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk gym-8020.apk
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev gym-8020.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "GYM-8020 dev build ${GITHUB_RUN_NUMBER}" \
            --notes "Newest development build (${GITHUB_SHA::7}, branch ${GITHUB_REF_NAME}). Installs over the previous build and keeps your data."

      # Versions (v0.5.0, ...) get their own release.
      # With the signing secrets set (docs/RELEASE.md) the version release is signed with your own key;
      # without them it is the debug-signed APK, like the dev builds.
      - name: Build signed release APK
        if: env.RELEASE_TAG != '' && env.RELEASE_KEYSTORE != ''
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Publish version release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            apk=$(ls app/build/outputs/apk/release/*-release.apk | head -1)
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
            "$apksigner" verify --print-certs "$apk" | grep -i "SHA-256"
          else
            apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          fi
          # Same file name for every version, so releases/latest/download/gym-8020.apk is always the newest.
          cp "$apk" gym-8020.apk
          # Release notes: the section of this version in CHANGELOG.md (a heading "## 1.2.0" or "## v1.2.0",
          # up to the next "## "); without that section GitHub's generated notes (#88).
          awk -v v="${RELEASE_TAG#v}" '
            /^## / { if (found) exit; h = $2; gsub(/\[|\]/, "", h); sub(/^v/, "", h); if (h == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md 2>/dev/null || true
          if grep -q '[^[:space:]]' release-notes.md 2>/dev/null; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::No section for ${RELEASE_TAG} in CHANGELOG.md; using generated release notes."
            notes=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" gym-8020.apk \
            --target "$GITHUB_SHA" --title "GYM-8020 ${RELEASE_TAG}" "${notes[@]}"

      - name: Upload reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: reports
          path: |
            core/build/reports
            app/build/reports
